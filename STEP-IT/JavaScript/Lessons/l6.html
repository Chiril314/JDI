<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="l6.css">
    <script src="l6.js" defer></script>
</head>
<body>
    <div class = "container">
        <img id = "track-cover">
        <h2 id = "track-title"></h2>
        <audio id = "track"></audio>
        <div class = "controls">
            <button id = "prev-track"> <i class="fa-solid fa-backward"></i> </button>
            <button id = "play-track"> <i class="fa-solid fa-play"></i> </button>
            <button id = "next-track"> <i class="fa-solid fa-forward"></i> </button>
        </div>
        <div class = "timebar">
            <span id = "current-time">0:00</span>
            <input type = "range" id = "progress" value = "0" min = "0" max = "100" step = "0.1">
            <span id = "duration">0:00</span>
        </div>
    </div>
</body>
</html>
